name: Android CI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # 当推送 v 开头的 tag 时自动触发 Release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史以读取 tag

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 不使用 android-actions/setup-android：它会去安装已被下架的 'tools' 包，
      # 在 ubuntu-latest 上直接失败（实测第 7 秒即挂，编译都还没开始）。
      # ubuntu-latest 镜像本身自带 Android SDK，且 license 已接受；
      # build.gradle 没有固定 buildToolsVersion，AGP 缺什么会自己下。
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK = $SDK"
          echo "--- platforms ---"; ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || true
          echo "--- licenses ---"; ls "$SDK/licenses" 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          # 通过环境变量传给 Gradle 内签名（KEYSTORE_FILE 为 base64 编码的 keystore）
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Artifacts
        run: |
          # 获取版本号，如果是 tag 触发则用 tag 名，否则用 short sha
          VERSION=${GITHUB_REF_NAME}
          if [[ $GITHUB_REF != refs/tags/* ]]; then
            VERSION="nightly-$(git rev-parse --short HEAD)"
          fi
          
          # 定义更正式的文件名
          OUTPUT_NAME="WebManagerLite-${VERSION}-release.apk"
          
          # 移动并重命名
          mkdir -p final_artifacts
          cp app/build/outputs/apk/release/*.apk "final_artifacts/${OUTPUT_NAME}"
          
          # 导出给后续步骤使用
          echo "FINAL_FILENAME=${OUTPUT_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: WebManagerLite ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🚀 OpenGW (WebManagerLite) ${{ env.VERSION }}

            ### 🧊 液态玻璃版本上线

            这一版把整个 Web 管理界面重做成了 iOS 26 那种液态玻璃风格 —— 而且不是普通的毛玻璃模糊，
            是**真折射**：顶栏、侧边栏和内容卡片会按各自的圆角形状把背后的背景**弯折**，
            边缘能看出内容被挤压，中间保持清晰。

            **外观设置**（顶栏右上角 🧊，登录页在右下角）

            - 玻璃效果三档：**液态**（真折射）/ **毛玻璃**（只模糊，最省）/ **关闭**（回到原样）
            - 背景四种：极光 / 纯色 / 本地图片 / 网址
            - 开关、分段控件、下拉框、操作按钮也全部玻璃化，配色沿用你熟悉的语义色
            - 侧边栏导航跟随一个会滑动的玻璃气泡

            **背景图网址（服务端缓存）**

            填一个网址点「抓取并应用」，服务端下载一次后落盘，之后刷新、重启都读本地文件不再联网，
            所以图片不会变，换设备 / 换浏览器看到的也是同一张。

            支持两类地址：直接指向图片的 URL，或返回 JSON 的接口 —— 例如 Bing 每日一图
            `https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1`，
            会自动从返回的 JSON 里取出图片地址。

            | 方法 | 路径 | 说明 |
            |---|---|---|
            | GET | `/api/appearance` | 读当前背景信息 |
            | POST | `/api/appearance/background` | 抓取并缓存，body `{url}` |
            | GET | `/api/appearance/background` | 返回图片本体 |
            | DELETE | `/api/appearance/background` | 清除 |

            **文档**

            - 实现细节、性能处理和踩过的坑：[README 的「液态玻璃皮肤」一节](https://github.com/leehe-byte/WebManagerLite#-液态玻璃皮肤)
            - 主题 / 样式适配指南：[docs/THEME.md](https://github.com/leehe-byte/WebManagerLite/blob/feature/liquid-glass/docs/THEME.md)
            - 插件开发：`docs/PLUGIN_DEV.md`

            ---

            自动编译结果包含：
            - `${{ env.FINAL_FILENAME }}`

            > ⚠️ 需要 Root（Magisk / KernelSU）。修改关键网络参数可能导致设备断连，请熟悉 Root 操作后再使用。
          files: final_artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (For non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_FILENAME }}
          path: final_artifacts/*.apk
          retention-days: 7
