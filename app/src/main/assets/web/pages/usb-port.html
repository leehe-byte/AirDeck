<div class="card">
    <div class="card-header">
        <h3><svg class="ico" aria-hidden="true"><use href="#i-plug"/></svg> ADB 控制</h3>
        <span id="adb-status-badge" class="status-badge" style="background: #eee; border-color: #ccc; color: #888;">检测中...</span>
    </div>
    <div class="info-table">
        <!-- USB 调试端口 -->
        <div class="operator-line">
            <div class="op-brand">
                <b style="font-size: 14px;">USB 调试端口</b>
                <div class="input-desc">开启后可通过 USB 连接进行 adb 调试</div>
            </div>
            <div class="ios-switch">
                <input type="checkbox" id="adb-usb-toggle">
                <label for="adb-usb-toggle" class="ios-slider"></label>
            </div>
        </div>

        <div style="height:1px; background:var(--border-color); margin:12px 0;"></div>

        <!-- 网络 ADB -->
        <div class="operator-line">
            <div class="op-brand">
                <b style="font-size: 14px;">网络 ADB</b>
                <div class="input-desc" id="adbnet-desc">开启后可通过 adb connect 连接</div>
            </div>
            <div class="ios-switch">
                <input type="checkbox" id="adbnet-toggle">
                <label for="adbnet-toggle" class="ios-slider"></label>
            </div>
        </div>

        <!-- 网络 ADB 端口 -->
        <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px;">
            <label style="font-size:12px; color:var(--text-sub);">端口</label>
            <input type="number" id="adbnet-port" value="5555" min="1" max="65535"
                   style="width:90px; padding:6px 8px; background:var(--card-bg); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; font-size:13px;"/>
            <button id="adbnet-apply" class="badge" style="border:none; cursor:pointer;">应用端口</button>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3><svg class="ico" aria-hidden="true"><use href="#i-info"/></svg> 说明</h3>
    </div>
    <div style="font-size: 13px; color: #666; line-height: 1.6;">
        <p>1. <b>USB 调试端口</b>：控制 USB 调试接口的开关。</p>
        <p>2. <b>网络 ADB</b>：开启后可用 <code>adb connect 设备IP:端口</code> 进行无线调试（需 root）。</p>
        <p>3. 修改端口后点「应用端口」，需保持网络 ADB 开启状态。</p>
    </div>
</div>
