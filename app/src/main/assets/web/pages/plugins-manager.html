<div class="card">
    <div class="card-header">
        <h3><svg class="ico" aria-hidden="true"><use href="#i-package"/></svg> 安装插件</h3>
    </div>
    <div class="info-table">
        <div style="margin-bottom: 14px;">
            <label style="font-size: 11px; color: var(--text-sub); display:block; margin-bottom:6px;">从文件上传（.owpkg 格式）</label>
            <input type="file" id="plugin-file-input" accept=".owpkg" style="width:100%; padding:6px; background: var(--card-bg); color: var(--text-main); border:1px solid var(--border-color); border-radius:4px; font-size:13px;"/>
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
            <input type="text" id="plugin-url-input" placeholder="http://example.com/xxx.owpkg" style="flex:1; min-width:180px; padding:8px; background: var(--card-bg); color: var(--text-main); border:1px solid var(--border-color); border-radius:4px; font-size:13px;"/>
            <button id="plugin-install-url-btn" class="badge" style="border:none; cursor:pointer; white-space:nowrap;"><svg class="ico" aria-hidden="true"><use href="#i-download"/></svg> 从 URL 安装</button>
        </div>
        <div id="plugin-install-status" style="display:none; margin-top:10px; padding:8px 10px; border-radius:6px; background:rgba(24,144,255,0.08); border:1px solid rgba(24,144,255,0.2); font-size:13px; color:var(--primary);">
            <span id="plugin-install-status-icon">⏳</span> <span id="plugin-install-status-text">正在安装...</span>
            <div style="margin-top:8px; height:6px; background:rgba(24,144,255,0.15); border-radius:3px; overflow:hidden;">
                <div id="plugin-install-bar" style="height:100%; width:0%; background:var(--primary); transition:width 0.5s;"></div>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3><svg class="ico" aria-hidden="true"><use href="#i-puzzle"/></svg> 已安装插件</h3>
        <span id="plugin-count" class="status-badge" style="background: #eee; border-color: #ccc; color: #888;">0 个</span>
    </div>
    <div id="plugin-list">
        <p style="color: var(--text-sub); font-size: 13px;">加载中...</p>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3><svg class="ico" aria-hidden="true"><use href="#i-info"/></svg> 说明</h3>
    </div>
    <div style="font-size: 13px; color: var(--text-sub); line-height: 1.6;">
        <p>1. 插件包为 <b>.owpkg</b> 格式（zip 压缩包），必须包含 <b>manifest.json</b> 与前端入口脚本。</p>
        <p>2. 插件安装后自动出现在侧边栏「插件」分组，也可向状态总览注册卡片。</p>
        <p>3. 卸载插件会执行其 remove.sh 并删除插件目录。</p>
        <p>4. <svg class="ico" aria-hidden="true"><use href="#i-puzzle"/></svg> 想自己开发插件？查看项目开发指南 <a href="https://github.com/leehe-byte/WebManagerLite/blob/main/docs/PLUGIN_DEV.md" target="_blank" rel="noopener" style="color:var(--primary);">docs/PLUGIN_DEV.md</a>，或参考 <b>demo 插件</b>作为最小示例。</p>
    </div>
</div>
