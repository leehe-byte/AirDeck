    <!-- 液态玻璃皮肤：纯增量，切换按钮由 js/liquid-glass.js 注入到顶栏 -->
    <link rel="stylesheet" href="css/liquid-glass.css">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <script>
        // 主题初始化
        (function() {
            const theme = localStorage.getItem('theme') || 'auto';
            if (theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();

        const isAndroidApp = !!window.AndroidBridge;
        if (isAndroidApp) {
            sessionStorage.setItem('isLoggedIn', 'true');
            // 从 App 侧直接取鉴权 token，避免等待 onPageFinished 注入造成的加载竞态
            try {
                const appToken = window.AndroidBridge.getToken();
                if (appToken) sessionStorage.setItem('authToken', appToken);
            } catch (e) {}
        } else if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
</head>

<header id="header">

            <span class="name">BridgeLink <span>Manager</span></span>

        <div class="top-status">

            <span id="system-info" class="status-badge">在线</span>
            <button id="logout-btn" class="btn-logout">退出</button>
        </div>
    </div>
</header>

                <a href="javascript:void(0)" class="nav-item" data-page="terminal"><p><svg class="ico" aria-hidden="true"><use href="#i-terminal"/></svg></p> Web 终端</a>

    <main id="content"></main>

<!-- 全局自定义提示/确认弹窗 -->
<div id="custom-modal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header"><h3 id="modal-title">提示</h3></div>
        <div class="modal-body" id="modal-content"></div>
        <div class="modal-footer">
            <button id="modal-cancel" class="btn-secondary">取消</button>
            <button id="modal-confirm" class="btn-primary">确定</button>
        </div>
    </div>
</div>

<!-- 全局自定义选择器 (Picker) -->
<div id="custom-picker" class="modal-overlay" onclick="if(event.target == this) this.classList.remove('active')">
    <div class="modal-container picker-container" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="picker-title">请选择</h3>
        </div>
        <div class="modal-body picker-list" id="picker-list" style="padding: 0;"></div>
        <div class="modal-footer">
            <button onclick="document.getElementById('custom-picker').classList.remove('active')" class="btn-secondary" style="width: 100%;">取消</button>
        </div>
    </div>
</div>
